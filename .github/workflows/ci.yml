name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync workspace
        run: uv sync --all-packages

      - name: Lint (ruff)
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Tests (api)
        run: uv run --directory apps/api pytest -q

      - name: Tests (worker)
        run: uv run --directory apps/worker pytest -q

      - name: Tests (music-core)
        run: uv run --directory packages/music-core pytest -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Build web
        run: pnpm --filter @pianoflow/web build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build API image
        run: docker build -f infra/docker/api.Dockerfile -t pianoflow-api .

      - name: Build worker image
        run: docker build -f infra/docker/worker.Dockerfile -t pianoflow-worker .

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [python, web, docker]
    runs-on: ubuntu-latest
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync workspace
        run: uv sync --all-packages

      - name: Run Alembic migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          if [ -n "$DATABASE_URL" ]; then
            uv run --directory apps/api alembic upgrade head
          else
            echo "DATABASE_URL not set — skipping migrations"
          fi

      - name: Deploy API to Render
        env:
          RENDER_DEPLOY_HOOK_API: ${{ secrets.RENDER_DEPLOY_HOOK_API }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK_API" ]; then
            curl -s "$RENDER_DEPLOY_HOOK_API"
            echo "API deploy triggered"
          else
            echo "RENDER_DEPLOY_HOOK_API not set — skipping"
          fi

      - name: Deploy Worker to Render
        env:
          RENDER_DEPLOY_HOOK_WORKER: ${{ secrets.RENDER_DEPLOY_HOOK_WORKER }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK_WORKER" ]; then
            curl -s "$RENDER_DEPLOY_HOOK_WORKER"
            echo "Worker deploy triggered"
          else
            echo "RENDER_DEPLOY_HOOK_WORKER not set — skipping"
          fi

      - name: Deploy to Modal
        if: env.MODAL_TOKEN_ID != '' && env.MODAL_TOKEN_SECRET != ''
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          uv pip install modal
          uv run modal deploy infra/modal/transcribe_app.py
          echo "Modal deployed successfully"
