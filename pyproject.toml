[project]
name = "pianoflow-ai"
version = "0.1.0"
description = "PianoFlow AI monorepo root (uv workspace)"
requires-python = ">=3.12"

[tool.uv.workspace]
members = ["apps/api", "apps/worker", "packages/music-core"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["apps/api", "apps/worker", "packages/music-core"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# B008: `Depends(...)` in argument defaults is the standard FastAPI idiom.
ignore = ["B008"]

# Tests run per project (apps/api, apps/worker, packages/music-core) because
# api and worker both use an `app/` package layout — see Makefile `test`.

