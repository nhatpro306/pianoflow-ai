services:
  - type: keyvalue
    name: pianoflow-redis
    plan: free
    ipAllowList: [] # internal connections only

  - type: web
    name: pianoflow-api
    runtime: docker
    dockerfilePath: infra/docker/api.Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: pianoflow-redis
          property: connectionString
      - key: STORAGE_BACKEND
        value: supabase
      - key: SUPABASE_URL
        value: https://kcznjjnhtajwumhvbasq.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: AUTH_MODE
        value: supabase
      - key: CORS_ALLOWED_ORIGINS
        value: https://pianoflow-jet.vercel.app
      - key: ENV
        value: prod
      - key: LOG_LEVEL
        value: INFO

  # Render free tier has no background workers — the worker runs as a web
  # service with a stub /healthz (apps/worker/app/main.py). UptimeRobot
  # pings keep both services awake.
  - type: web
    name: pianoflow-worker
    runtime: docker
    dockerfilePath: infra/docker/worker.Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: pianoflow-redis
          property: connectionString
      - key: STORAGE_BACKEND
        value: supabase
      - key: SUPABASE_URL
        value: https://kcznjjnhtajwumhvbasq.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ENV
        value: prod
      - key: LOG_LEVEL
        value: INFO
