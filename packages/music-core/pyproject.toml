[project]
name = "pianoflow-music"
version = "0.1.0"
description = "PianoFlow AI — pure music-processing library (no I/O, no vendor SDKs)"
requires-python = ">=3.12"
dependencies = [
    "mido>=1.3",
    "pretty_midi>=0.2.10",
]
# Phase 6 adds: music21. Phase 7: numpy, opencv-python-headless, pillow.

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pianoflow_music"]
