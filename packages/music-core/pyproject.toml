[project]
name = "pianoflow-music"
version = "0.1.0"
description = "PianoFlow AI — pure music-processing library (no I/O, no vendor SDKs)"
requires-python = ">=3.12"
dependencies = [
    "mido>=1.3",
    "numpy>=2.4.6",
    "pillow>=12.2.0",
    "pretty_midi>=0.2.10",
]
# Phase 6 adds: music21. Phase 7: numpy, opencv-python-headless, pillow.

# basic-pitch 0.4.0 requires tensorflow<2.15.1 which has no Python 3.12 wheels;
# install this extra on a dedicated audio worker running Python ≤3.11.
[project.optional-dependencies]
basic-pitch = ["basic-pitch[onnx]>=0.4.0; python_version < '3.12'"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pianoflow_music"]
